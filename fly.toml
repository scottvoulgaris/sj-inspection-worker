app = "inspection-automation-worker"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Every date decision in the worker uses local midnight, and the portal runs
  # on Pacific time. Without this the container runs UTC and the day boundary
  # sits 7-8 hours early, making the notice window a day over-conservative
  # every evening and mis-flagging next-day inspections as past-due.
  TZ = "America/Los_Angeles"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
